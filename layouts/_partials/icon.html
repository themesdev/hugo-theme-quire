{{- /* icon.html: a lucide icon from data/icons.json. (dict "name" "map-pin" "class" "size-5") */ -}}
{{- $svg := index hugo.Data.icons .name }}
{{- if not $svg }}{{ errorf "icon %q is not in data/icons.json" .name }}{{ end -}}
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ .stroke | default 2 }}" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-{{ .name }} {{ .class }}" aria-hidden="true">{{ $svg | safeHTML }}</svg>
{{- /**/ -}}
